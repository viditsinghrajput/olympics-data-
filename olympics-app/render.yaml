services:
  # FastAPI backend
  - type: web
    name: olympics-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # Streamlit frontend
  - type: web
    name: olympics-frontend
    runtime: python
    plan: free
    rootDir: frontend
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BACKEND_URL
        sync: false # set this manually in the Render dashboard to the
                    # public URL of the olympics-api service, e.g.
                    # https://olympics-api.onrender.com
